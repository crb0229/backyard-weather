plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.crb0229.backyardweather'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.crb0229.backyardweather'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.2'
    }

    // The signing key is kept out of the repo: the build workflow writes it from GitHub secrets
    // (TV_KEYSTORE_B64 and TV_KEYSTORE_PASS) just before building. Same key every build, so updates install over the old app.
    signingConfigs {
        tv {
            storeFile file('tv.keystore')
            storePassword System.getenv('TV_KEYSTORE_PASS')
            keyAlias 'tv'
            keyPassword System.getenv('TV_KEYSTORE_PASS')
        }
    }
    lint {
        checkReleaseBuilds false   // a personal sideloaded app; don't let store-publishing checks stop the build
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.tv
        }
    }
}
