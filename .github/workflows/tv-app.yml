name: tv app

# Builds the Android TV app whenever its files change (or on demand) and saves it as tv.apk,
# downloadable at https://crb0229.github.io/backyard-weather/tv.apk
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/tv-app.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build
        run: gradle -p android assembleRelease
      - name: Save tv.apk
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk tv.apk
          git config user.name "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          git add tv.apk
          git diff --cached --quiet && exit 0
          git commit -m "tv app build"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 10; done
          exit 1
