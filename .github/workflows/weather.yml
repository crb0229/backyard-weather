name: weather data

on:
  schedule:
    - cron: "*/15 * * * *"   # station reading every 15 min (GitHub may run these late)
    - cron: "40 9 * * *"     # daily: about 4:40-5:40 AM Michigan time
  workflow_dispatch:
    inputs:
      job:
        description: "latest, daily, or backfill"
        default: backfill

permissions:
  contents: write

concurrency: weather-data

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect
        env:
          AMBIENT_API_KEY: ${{ secrets.AMBIENT_API_KEY }}
          AMBIENT_APP_KEY: ${{ secrets.AMBIENT_APP_KEY }}
        run: |
          JOB="${{ github.event.inputs.job }}"
          if [ -z "$JOB" ]; then
            if [ "${{ github.event.schedule }}" = "40 9 * * *" ]; then JOB=daily; else JOB=latest; fi
          fi
          python wx.py "$JOB"
      - name: Save
        if: always()
        run: |
          git config user.name "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "weather data" && git push)
